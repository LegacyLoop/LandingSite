# CMD-LANE-C-REGISTER-CI-GATE V20 · LANDING handoff · Agent C · 2026-07-29
#
# The landing repo's FIRST workflow. Same tripwire as the app, scanning the
# LANDING rows of the shared Truth Register. Lane A owns the landing checkout —
# this gate is CI-side only and never touches product code.
#
# Zero dependencies (pure Node builtins) — no `npm ci`, no secrets.
# See scripts/truth-gate.mjs header + this dir's README.md for the sync rule.

name: truth-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: truth-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  truth-gate:
    name: register truth gate — LANDING
    runs-on: ubuntu-latest
    # 10 min (not 5): during GitHub action-download outages the setup steps retry for
    # minutes; a tight 5-min cap cancelled the (instant, zero-dep) gate as if it failed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # No setup-node action: the gate is pure Node builtins and ubuntu-latest ships a
      # modern Node — dropping the action removes a flaky download from the critical path.
      - name: Truth gate — no removed LANDING claim may return
        run: node scripts/truth-gate.mjs --repo=LANDING
